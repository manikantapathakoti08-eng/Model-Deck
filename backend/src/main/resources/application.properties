spring.application.name=ModelDeck

# Gemini API
spring.ai.google.genai.api-key = ${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash

# 2. OpenRouter API
spring.ai.openai.api-key= ${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.options.model=openrouter/free

# Limit the max tokens so it stays under your key's 20,000 allowance
spring.ai.openai.chat.options.max-tokens=2000

#Ollama
spring.ai.ollama.chat.options.model=llama3.2:1b